            "2 - Monster High\n"+
            "3 - Bratz\n"+
            "4 - Rainbow High\n"+
            "5 - Mirror Mi\n"+
            "6 - Disney Doll\n"
            ));

        let genero;

        switch (opcao){
        case 1:
            estilo = "Barbie";
            break;
        case 2:
            estilo = "Monster High";
            break;
        case 3:
            estilo = "Bratz";
            break;
        case 4:
            estilo = "Rainbow High";

        case 5:
